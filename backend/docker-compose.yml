version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csa_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/csa_risk
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        alembic upgrade head ||
        python -c \"from app.database.base import Base; from app.database.session import engine; import asyncio; asyncio.run(Base.metadata.create_all(engine))\"
      "
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/csa_risk
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
