version: "3.8"

# STANDALONE ONLY: frontend against a separately deployed backend.
# Do NOT run alongside the root docker-compose.yml — both need frontend
# host port 3001 unless you override FRONTEND_PORT.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raven_standalone_frontend
    restart: always
    environment:
      RAVEN_BACKEND_URL: ${RAVEN_BACKEND_URL:?Set RAVEN_BACKEND_URL in frontend/.env}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
