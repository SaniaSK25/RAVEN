# RAVEN nginx snippet — serve second app under /raven/, keep app1 on / untouched.
#
# THIS IS NOT A STANDALONE SERVER BLOCK. Bare `location` directives are only
# valid INSIDE an existing `server { ... }` block. Copying this file into
# /etc/nginx/conf.d/ as-is WILL FAIL `nginx -t` — that failure is the safety
# net (nginx refuses to reload a broken config, so app1 keeps running).
#
# SAFE INSTALL (never replaces app1's config, always backs up first):
#   1. Inspect first (read-only):
#        sudo nginx -T | head -80              # find the `server { listen 80 ... }` block serving app1
#        docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Image}}'
#   2. Back up nginx config:
#        sudo cp -a /etc/nginx /root/nginx.backup.$(date +%F)
#   3. Copy this snippet somewhere include-able (NOT conf.d root):
#        sudo cp deploy/nginx-raven.conf /etc/nginx/snippets/raven.conf
#   4. Edit ONLY the existing port-80 server block that serves app1 and add:
#        include /etc/nginx/snippets/raven.conf;
#      alongside its existing `location / { ... }` (do NOT touch that block).
#   5. Validate — reload ONLY if this passes (failed test = app1 untouched):
#        sudo nginx -t && sudo systemctl reload nginx
#   6. Rollback if anything is wrong:
#        sudo cp -a /root/nginx.backup.<date>/* /etc/nginx/ && sudo systemctl reload nginx
#
# Requires the root compose stack running (frontend on 127.0.0.1:3001).

location = /raven { return 301 /raven/; }

location /raven/ {
    proxy_pass http://127.0.0.1:3001/raven/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
}
